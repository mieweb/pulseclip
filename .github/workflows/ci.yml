name: CI

on:
  push:
    branches: [ main, copilot/** ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Init only the ui submodule: the repo has a stray gitlink at tools/pulse
    # (no .gitmodules entry) that breaks `submodules: true` checkout.
    - name: Init ui submodule
      run: git submodule update --init ui

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Setup pnpm (for the ui submodule)
      uses: pnpm/action-setup@v4
      with:
        package_json_file: ui/package.json

    - name: Build @mieweb/ui submodule
      run: cd ui && pnpm install --frozen-lockfile && pnpm build

    - name: Install dependencies
      run: npm install
    
    - name: Build server
      run: npm run build:server
    
    - name: Build client
      run: npm run build:client
    
    - name: Check for vulnerabilities
      run: npm audit --audit-level=moderate
      continue-on-error: true
