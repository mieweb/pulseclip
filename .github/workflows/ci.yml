name: CI

on:
  push:
    branches: [ main, copilot/** ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    # Init only the ui submodule: the repo has a stray gitlink at tools/pulse
    # (no .gitmodules entry) that breaks `submodules: true` checkout.
    - name: Init ui submodule
      run: git submodule update --init ui

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    # Use corepack (bundled with Node) to provide the pnpm version pinned in
    # ui/package.json's "packageManager" field — avoids the deprecated
    # pnpm/action-setup action that still ran on Node 20.
    - name: Enable pnpm (for the ui submodule)
      run: corepack enable

    - name: Build @mieweb/ui submodule
      run: cd ui && pnpm install --frozen-lockfile && pnpm build

    - name: Install dependencies
      run: npm install
    
    - name: Build server
      run: npm run build:server
    
    - name: Build client
      run: npm run build:client
    
    - name: Check for vulnerabilities
      run: npm audit --audit-level=moderate
      continue-on-error: true
